apiVersion: apps/v1
kind: Deployment
metadata:
  name: chipid-api
  labels: { app: chipid-api }
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: chipid-api }
  template:
    metadata:
      labels: { app: chipid-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
    spec:
      serviceAccountName: chipid-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/chipid/api:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4000, name: http }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: API_PORT, value: "4000" }
          envFrom:
            - secretRef: { name: chipid-api-secrets }
            - configMapRef: { name: chipid-api-config }
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "768Mi" }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            failureThreshold: 4
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: csca, mountPath: /etc/chipid/csca, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        - name: csca
          secret: { secretName: chipid-csca-trust-anchors }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: chipid-api } }
---
apiVersion: v1
kind: Service
metadata:
  name: chipid-api
spec:
  selector: { app: chipid-api }
  ports: [{ port: 80, targetPort: http, name: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chipid-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chipid-api
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chipid-api
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: chipid-api }
